# ─────────────────────────────────────────────────────────────────────────────
#  Cove — default install.
#
#  Three services, no mandatory reverse-proxy config, no Redis, no S3, no SMTP.
#  Everything else is opt-in via compose profiles (see compose.live.yaml).
#
#  Start with:  ./setup.sh && podman compose up -d     (or `docker compose up -d`)
# ─────────────────────────────────────────────────────────────────────────────
name: cove

# ─────────────────────────────────────────────────────────────────────────────
#  Which uid containers run as inside, for anything that writes to ./data.
#
#  This matters more than it looks. **Rootless Podman** (the default on Fedora)
#  maps container uids into a subordinate range, so container-uid 1000 is NOT
#  host-uid 1000 — a bind mount owned by you with mode 755 is therefore not
#  writable by a container running as uid 1000, and jobs die with
#  "EACCES: permission denied, mkdir '/data/media'".
#
#  Running as root *inside* the container is the standard fix, and under rootless
#  Podman it is not a privilege escalation: container-root maps to the invoking user,
#  so published media ends up owned by you and stays manageable from the host. The
#  alternative — `podman unshare chown 1000:1000 ./data` — leaves the directory owned
#  by a subuid you cannot write to yourself, which is worse for a personal media
#  library you may want to reorganise or back up.
#
#  On **rootful Docker**, container-root really is host root, so set these to your own
#  ids instead:  COVE_UID=$(id -u) COVE_GID=$(id -g)
# ─────────────────────────────────────────────────────────────────────────────
x-cove-user: &cove-user "${COVE_UID:-0}:${COVE_GID:-0}"

services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cove}
      # Fail loudly with an actionable message rather than booting a database
      # with an empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — run ./setup.sh to generate a .env}
      POSTGRES_DB: ${POSTGRES_DB:-cove}
      # Explicit UTF-8 only. Deliberately no ICU/collation flags: the alpine
      # image does not reliably provide the ICU locale provider, and a first run
      # that dies inside initdb is far worse than a default collation. Collation
      # is worth setting deliberately later, once the stack is known good.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      # A named volume, never a host path: Postgres on a network share corrupts.
      #
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data. The
      # postgres:18 images changed their layout — data now lives in a
      # major-version-specific subdirectory — and mounting the old path makes the
      # entrypoint refuse to start with:
      #   "there appears to be PostgreSQL data in /var/lib/postgresql/data
      #    (unused mount/volume)"
      # This is a genuine 18+ breaking change for every pre-existing compose file,
      # and it only shows up when you actually run it (found by running it).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cove} -d ${POSTGRES_DB:-cove}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [cove]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    user: *cove-user
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Composed from the parts so a self-hoster only edits the password once.
      DATABASE_URL: postgres://${POSTGRES_USER:-cove}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cove}
      COVE_DATA_DIR: /data
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Migrations run on boot, so the correct path must be explicit — it differs
      # between `next dev` and the standalone production image.
      COVE_MIGRATIONS_DIR: /app/drizzle
    volumes:
      # `:z` — lowercase — is the SHARED SELinux relabel. It has to be shared,
      # because three containers mount this path (web, worker, caddy).
      #
      # `:Z` is the *private* relabel: it labels the directory for one container
      # only, so with several mounters the last one to start wins and the others
      # get EACCES. That is exactly what happened here — the worker could write
      # /data while the web app and Caddy were both denied.
      - ./data:/data:z
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [cove]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    user: *cove-user
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-cove}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cove}
      COVE_DATA_DIR: /data
      # 1 by default: a second concurrent transcode on modest hardware makes both
      # slower, and the queue is not the bottleneck.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      COVE_POWER_PRESET: ${COVE_POWER_PRESET:-balanced}
      COVE_VIDEO_ENCODER: ${COVE_VIDEO_ENCODER:-libx264}
    volumes:
      # The same volume the web app serves from, so publishing a video is a rename
      # rather than a copy. `:z` not `:Z` — see the note on the web service.
      - ./data:/data:z
    depends_on:
      db:
        condition: service_healthy
    # An encode can run for a long time. Give it the chance to finish and clean up
    # instead of being killed mid-write, which would leave scratch directories behind.
    stop_grace_period: 2m
    networks: [cove]

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      # Host ports are configurable, and default to UNPRIVILEGED ports.
      #
      # Rootless Podman cannot bind anything below 1024 — the kernel default for
      # net.ipv4.ip_unprivileged_port_start is 1024 — so publishing 80 fails with
      # "rootlessport cannot expose privileged port 80". Rootless Podman is the
      # normal setup on Fedora, so defaulting to 8080/8443 means `compose up`
      # works for an ordinary user with no system changes at all.
      #
      # To serve on the real ports, either raise the floor:
      #   sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
      #   (persist it in /etc/sysctl.d/99-cove.conf)
      # or run the stack rootful, and set COVE_HTTP_PORT=80 / COVE_HTTPS_PORT=443.
      - "${COVE_HTTP_PORT:-8080}:80"
      - "${COVE_HTTPS_PORT:-8443}:443"
      - "${COVE_HTTPS_PORT:-8443}:443/udp" # HTTP/3
    environment:
      # The site address Caddy should serve. A bare hostname or https:// URL
      # triggers automatic Let's Encrypt; `http://localhost` stays plain HTTP so
      # a LAN install never blocks on certificate issuance.
      COVE_SITE_ADDRESS: ${COVE_SITE_ADDRESS:-http://localhost}
      COVE_ACME_EMAIL: ${COVE_ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      # Read-only access to the media volume, so /media/* can be served directly.
      # `ro,z` — shared again, for the same reason as the other two.
      - ./data:/srv/data:ro,z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks: [cove]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  cove:
